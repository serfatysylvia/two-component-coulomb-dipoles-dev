name = "TwoComponentCoulomb"
version = "1.0.0"
defaultTargets = ["TwoComponentCoulomb"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "TwoComponentCoulomb"
# Build the root and every module under the namespace.
globs = ["TwoComponentCoulomb", "TwoComponentCoulomb.+"]
